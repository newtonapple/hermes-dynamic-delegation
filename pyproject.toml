# Tooling config only. This directory is a Hermes plugin (plugin.yaml + __init__.py), not a
# pip-installable package, so there is deliberately no [project] table: the plugin loader imports
# the directory, and declaring packaging metadata here would invite pip to build it.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "S", "ANN", "C4", "SIM", "RET", "ARG", "PIE", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN001", "ANN201", "ARG001"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
